[workspace]
resolver = "3"

members = ["foundation-track"]

[workspace.package]
name = "meridian-space"
description = "The Meridian Space Academy course."
version = "0.1.0"
edition = "2024"
homepage = "https://rustycloud.org/index.html"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = "1.11"
hyper-util = "0.1"
num_cpus = "1"
pin-project-lite = "0.2"
rand = "0.10"
reqwest = "0.13"
serde = "1.0"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
