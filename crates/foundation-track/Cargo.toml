[package]
name = "foundation-track"
description = """
The foundation of async programming in rust,
including 4 modules which span from fundamentals, concurrency primitives,
message passing patterns, network programming, data-oriented programming
to performace & profiling.
"""
version.workspace = true
edition.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
bumpalo = { workspace = true, optional = true }
bytes.workspace = true
dhat = { workspace = true, optional = true }
fastrand.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
jiff.workspace = true
num_cpus.workspace = true
pin-project-lite.workspace = true
rand.workspace = true
rayon = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "query"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
criterion.workspace = true

[features]
default = []
bump = ["dep:bumpalo"]
rayon = ["dep:rayon"]
dhat-heap = ["dep:dhat"]

[profile.release]
debug = true # Include debug symbols (DWARF info).


